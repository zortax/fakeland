[package]
name = "fakeland-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fakeland-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
fakeland.workspace = true
fakeland-bench.workspace = true
fakeland-control.workspace = true
fakeland-scenario.workspace = true
fakeland-trace.workspace = true
fakeland-types.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# The nested viewer window of session_start viewer=true.
viewer = ["fakeland/viewer"]
# GPU samples of NVIDIA GPUs through NVML.
nvml = ["fakeland/nvml"]

[dev-dependencies]
tempfile.workspace = true

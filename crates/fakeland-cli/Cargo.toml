[package]
name = "fakeland-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fakeland"
path = "src/main.rs"
# The library `fakeland` owns the docs under this name.
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
fakeland-bench.workspace = true
fakeland.workspace = true
fakeland-control.workspace = true
fakeland-scenario.workspace = true
fakeland-trace.workspace = true
fakeland-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# The nested viewer window of `--viewer`.
viewer = ["fakeland/viewer"]
# GPU samples of NVIDIA GPUs through NVML for `--sample`.
nvml = ["fakeland/nvml"]

[dev-dependencies]
tempfile.workspace = true
